<!DOCTYPE html>

<head>
    <meta charset="UTF-8">

    <link rel="stylesheet" href="style.css">
</head>

<body>

    <!-- Navigation -->

    <nav class="navbar">

        <div class="logo">
            FA.
        </div>

        <ul class="nav-links">

            <li>
                <a href="index.html">Home</a>
            </li>

            </li>

            <li>
                <a class="active" href="contact.html">Contact</a>
            </li>

        </ul>
    </nav>


    <!-- Contact Section -->

    <main class="contact">

        <div class="contact-container">

            <p class="contact-subtitle">
                GET IN TOUCH
            </p>

            <h1>
                Contact Me
            </h1>

            <p class="contact-introduction">
                Have a question or want to get in touch?
                Send me a message using the form below.
            </p>


            <!-- Contact Form -->

            <form id="contactForm" class="contact-form">


                <!-- Name -->

                <label for="name">
                    Name
                </label>

                <input
                    type="text"
                    id="name"
                    name="name"
                    placeholder="Enter your name"
                    required
                >


                <!-- Email -->

                <label for="email">
                    Email
                </label>

                <input
                    type="email"
                    id="email"
                    name="email"
                    placeholder="Enter your email"
                    required
                >


                <!-- Subject -->

                <label for="subject">
                    Subject
                </label>

                <input
                    type="text"
                    id="subject"
                    name="subject"
                    placeholder="Enter the subject"
                    required
                >


                <!-- Message -->

                <label for="message">
                    Message
                </label>

                <textarea
                    id="message"
                    name="message"
                    rows="6"
                    placeholder="Write your message..."
                    required
                ></textarea>


                <!-- Submit -->

                <button
                    type="submit"
                    class="portfolio-button"
                >
                    Submit
                </button>


                <p id="formMessage"></p>

            </form>

        </div>

    </main>


    <!-- Footer -->

    <footer>

        </p>

    </footer>


    <script src="script.js"></script>

</body>
